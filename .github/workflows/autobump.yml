# brew tap-new uses this file to generate an autobump workflow for the new tap
name: brew bump

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
  schedule:
    # Every day at 4:5 UTC
    - cron: 5 4 * * *

permissions: {}

concurrency:
  group: autobump
  cancel-in-progress: false

env:
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_NO_AUTO_UPDATE: 1

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    name: Bump ${{ matrix.package_kind }}
    strategy:
      fail-fast: false
      matrix:
        package_kind: [formulae, casks]
    runs-on: macos-26
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      - name: Bump packages
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
          PACKAGE_KIND: ${{ matrix.package_kind }}
        run: |
          args=(--no-fork --open-pr "--$PACKAGE_KIND" "--tap=$TAP_NAME")
          if [[ "$PACKAGE_KIND" == formulae ]]; then
            args+=(--bump-synced)
          fi
          brew bump "${args[@]}"
