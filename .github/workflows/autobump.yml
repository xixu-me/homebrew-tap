# brew tap-new uses this file to generate an autobump workflow for the new tap
name: brew bump

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
  schedule:
    # Every 3 hours at 23 minutes past the hour
    - cron: "23 */3 * * *"

permissions: {}

concurrency:
  group: autobump
  cancel-in-progress: false

env:
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_NO_AUTO_UPDATE: 1

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    name: Bump ${{ matrix.package_kind }}
    strategy:
      fail-fast: false
      matrix:
        package_kind: [formulae, casks]
    runs-on: macos-26
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1

      - name: Bump packages
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.AUTOBUMP_TOKEN || secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_NAME: github-actions[bot]
          HOMEBREW_GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          HOMEBREW_GIT_COMMITTER_NAME: github-actions[bot]
          HOMEBREW_GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
          PACKAGE_KIND: ${{ matrix.package_kind }}
        run: |
          args=(--no-fork --open-pr "--$PACKAGE_KIND" "--tap=$TAP_NAME")
          if [[ "$PACKAGE_KIND" == formulae ]]; then
            args+=(--bump-synced)
          fi
          brew bump "${args[@]}"

      - name: Enable auto-merge for bump pull requests
        env:
          GH_TOKEN: ${{ secrets.AUTOBUMP_TOKEN || secrets.GITHUB_TOKEN }}
          PACKAGE_KIND: ${{ matrix.package_kind }}
        run: |
          if [[ "$PACKAGE_KIND" == formulae ]]; then
            path_prefix=Formula/
          else
            path_prefix=Casks/
          fi

          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --limit 100 \
            --json number,author,headRefName,files |
            jq -r \
              --arg path_prefix "$path_prefix" \
              '.[]
               | select(.headRefName | startswith("bump-"))
               | select(any(.files[]; .path | startswith($path_prefix)))
               | .number' |
            while read -r pull_request; do
              [[ -z "$pull_request" ]] && continue
              gh pr merge "$pull_request" \
                --repo "$GITHUB_REPOSITORY" \
                --auto \
                --squash
            done
